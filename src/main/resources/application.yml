server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: guardian-escolar-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:guardian_escolar}
    username: ${DB_USERNAME:guardian}
    password: ${DB_PASSWORD:guardian}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

guardian:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-use-at-least-32-characters-for-local-development}
      access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:30d}
    codes:
      expiration: ${SECURITY_CODE_EXPIRATION:10m}
      max-attempts: ${SECURITY_CODE_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
